spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/auth}
    username: ${DATABASE_USER:auth}
    password: ${DATABASE_PASSWORD:auth}

auth:
  base-url: http://localhost:8080
  root-domain: localhost
  cookie-domain: ""
  secure-cookies: false
  default-redirect: http://localhost:8080/account
  dev-staff-email: ${AUTH_DEV_STAFF_EMAIL:}
  oauth:
    generate-jwt-key: true
  mail:
    from: ${EMAIL_FROM:onboarding@resend.dev}
    log-code-if-unsent: true
    log-codes-without-key: true
