<!--/* @thymesVar id="firstName" type="java.lang.String" */-->
<!--/* @thymesVar id="lastName" type="java.lang.String" */-->
<!--/* @thymesVar id="error" type="java.lang.String" */-->

<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Welcome', ~{::content})}">
<th:block th:fragment="content">
    <h1 class="mb-2 font-display text-2xl font-bold">Welcome to Limelight Creatives!</h1>
    <p class="mb-8 text-sm opacity-65">Let us know your name and you're all set.</p>

    <form method="post" th:action="@{/login/name}" class="flex flex-col gap-3">
        <input type="text" name="firstName" required maxlength="100" autocomplete="given-name" placeholder="First name"
               aria-label="First name" th:value="${firstName}" autofocus class="field">
        <input type="text" name="lastName" required maxlength="100" autocomplete="family-name" placeholder="Last name"
               aria-label="Last name" th:value="${lastName}" class="field">
        <button th:replace="~{fragments/button :: submit('Finish', 'Saving…')}"></button>
        <p th:replace="~{fragments/button :: error(${error})}"></p>
    </form>
</th:block>
</html>
