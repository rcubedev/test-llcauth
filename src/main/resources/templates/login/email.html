<!--/* @thymesVar id="invite" type="java.lang.Boolean" */-->
<!--/* @thymesVar id="email" type="java.lang.String" */-->
<!--/* @thymesVar id="error" type="java.lang.String" */-->

<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Sign in', ~{::content})}">
<th:block th:fragment="content">
    <h1 class="mb-2 font-display text-3xl font-bold" th:text="${invite} ? 'Join Limelight Creatives' : 'Sign in'">Sign in</h1>
    <p class="mb-8 text-sm opacity-65"
       th:text="${invite} ? 'You have been invited to join as a staff member! Enter your email and we’ll send you a 6-digit code.' : 'We’ll email you a 6-digit code.'">
        We’ll email you a 6-digit code.
    </p>

    <form method="post" th:action="@{/login}" class="flex flex-col gap-3">
        <input type="email" name="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"
               aria-label="Email" th:value="${email}" class="field">
        <button th:replace="~{fragments/button :: submit('Send code', 'Sending code…')}"></button>
        <p th:replace="~{fragments/button :: error(${error})}"></p>
    </form>
</th:block>
</html>
