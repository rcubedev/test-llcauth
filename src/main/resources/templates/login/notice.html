<!--/* @thymesVar id="notice" type="java.lang.String" */-->

<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Signed in', ~{::content})}">
<th:block th:fragment="content">
    <h1 class="mb-2 font-display text-2xl font-bold">You’re signed in</h1>
    <p class="mb-8 text-sm opacity-65" th:text="${notice} ?: 'We couldn’t apply that invite link.'">Notice</p>
    <a th:replace="~{fragments/button :: link(@{/login/continue}, 'Continue')}"></a>
</th:block>
</html>
