<!--/* @thymesVar id="email" type="java.lang.String" */-->
<!--/* @thymesVar id="warning" type="java.lang.String" */-->
<!--/* @thymesVar id="error" type="java.lang.String" */-->

<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Enter your code', ~{::content})}">
<th:block th:fragment="content">
    <h1 class="mb-2 font-display text-2xl font-bold">Enter your code</h1>
    <p class="mb-8 text-sm opacity-65">
        <th:block th:text="${warning} ? 'For' : 'Sent to'">Sent to</th:block>
        <span th:text="${email}">you@example.com</span>. It expires in 10 minutes.
    </p>
    <p th:if="${warning}" class="-mt-4 mb-6 border-2 border-dashed border-[var(--foreground)] p-3 text-xs" role="status"
       th:text="${warning}">Warning</p>

    <form method="post" th:action="@{/login/code}" class="flex flex-col gap-3">
        <input type="text" name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               autocomplete="one-time-code" placeholder="000000" aria-label="6-digit code" autofocus
               class="field text-center text-lg tracking-[0.5em]">
        <button th:replace="~{fragments/button :: submit('Verify', 'Checking…')}"></button>
        <p th:replace="~{fragments/button :: error(${error})}"></p>
    </form>

    <a th:href="@{/login}" class="mt-3 block text-center text-xs underline opacity-60">Use a different email</a>
</th:block>
</html>
