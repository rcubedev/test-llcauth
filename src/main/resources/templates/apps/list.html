<!--/* @thymesVar id="apps" type="java.util.List<org.limelightcreatives.auth.oauth.Apps.App>" */-->

<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Apps', ~{::content})}">
<th:block th:fragment="content">
    <a th:href="@{/account}" class="mb-6 inline-block text-sm underline">Account</a>
    <h1 class="mb-2 font-display text-2xl font-bold">Apps</h1>
    <p class="mb-8 text-sm opacity-65">Apps that can sign people in with their Limelight Creatives account.</p>

    <ul th:unless="${apps.isEmpty()}" class="mb-8 flex flex-col gap-3 text-sm">
        <li th:each="app : ${apps}">
            <a th:href="@{/apps/{id}(id=${app.id()})}" th:text="${app.settings().name()}" class="font-bold underline">Dashboard</a>
            <br>
            <code th:text="${app.clientId()}" class="break-all opacity-65">dashboard</code>
        </li>
    </ul>
    <p th:if="${apps.isEmpty()}" class="mb-8 text-sm">No apps yet.</p>

    <a th:replace="~{fragments/button :: link(@{/apps/new}, 'Add an app')}"></a>
</th:block>
</html>
