<!--/* @thymesVar id="app" type="org.limelightcreatives.auth.oauth.Apps.App" */-->
<!--/* @thymesVar id="form" type="org.limelightcreatives.auth.web.AppForm" */-->
<!--/* @thymesVar id="secret" type="java.lang.String" */-->
<!--/* @thymesVar id="saved" type="java.lang.Boolean" */-->
<!--/* @thymesVar id="error" type="java.lang.String" */-->
<!--/* @thymesVar id="title" type="java.lang.String" */-->

<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${title}, ~{::content})}">
<th:block th:fragment="content">
    <a th:href="@{/apps}" class="mb-6 inline-block text-sm underline">All apps</a>
    <h1 class="mb-6 font-display text-2xl font-bold" th:text="${title}">Dashboard</h1>

    <div th:if="${secret}" class="mb-6 border-2 border-[var(--foreground)] p-3 text-sm" role="status">
        <p class="mb-2 font-bold">Copy the client secret now. It won't be shown again.</p>
        <code th:text="${secret}" class="block break-all select-all">secret</code>
    </div>
    <p th:if="${saved}" class="mb-6 text-sm" role="status">Saved.</p>

    <dl th:if="${app}" class="mb-6 text-sm">
        <dt class="opacity-65">Client ID</dt>
        <dd><code th:text="${app.clientId()}" class="break-all select-all">dashboard</code></dd>
    </dl>

    <form method="post" th:action="${app != null} ? @{/apps/{id}(id=${app.id()})} : @{/apps}" class="flex flex-col gap-4">
        <label class="flex flex-col gap-1 text-sm">
            Name
            <input type="text" name="name" required maxlength="200" th:value="${form.name()}" class="field">
        </label>

        <fieldset class="flex flex-col gap-1 text-sm" th:disabled="${app != null}">
            <legend class="mb-1">Type</legend>
            <label class="flex gap-2">
                <input type="radio" name="publicClient" value="false" th:checked="${!form.publicClient()}">
                Server app, which keeps a secret
            </label>
            <label class="flex gap-2">
                <input type="radio" name="publicClient" value="true" th:checked="${form.publicClient()}">
                Browser or mobile app, with no secret
            </label>
        </fieldset>

        <label class="flex flex-col gap-1 text-sm">
            Redirect URLs, one per line
            <textarea name="redirectUrls" required rows="3" th:text="${form.redirectUrls()}" class="field"
                      placeholder="https://app.example/login/oauth2/code/limelight"></textarea>
        </label>

        <label class="flex flex-col gap-1 text-sm">
            Sign-out redirect URLs, one per line
            <textarea name="signOutUrls" rows="2" th:text="${form.signOutUrls()}" class="field"
                      placeholder="https://app.example/"></textarea>
        </label>

        <label class="flex flex-col gap-1 text-sm">
            ID token signature
            <select name="idTokenAlgorithm" class="field">
                <option value="RS256" th:selected="${form.idTokenAlgorithm() == 'RS256'}">RS256 (works with every app)</option>
                <option value="ES256" th:selected="${form.idTokenAlgorithm() == 'ES256'}">ES256</option>
            </select>
        </label>

        <button th:replace="~{fragments/button :: submit(${app != null ? 'Save' : 'Add app'}, 'Saving…')}"></button>
        <p th:replace="~{fragments/button :: error(${error})}"></p>
    </form>

    <th:block th:if="${app}">
        <form th:unless="${app.settings().publicClient()}" method="post" th:action="@{/apps/{id}/secret(id=${app.id()})}" class="mt-8">
            <p class="mb-3 text-sm opacity-65">A new secret replaces the old one straight away.</p>
            <button th:replace="~{fragments/button :: submit('New secret', 'Making…')}"></button>
        </form>
        <form method="post" th:action="@{/apps/{id}/delete(id=${app.id()})}" class="mt-8">
            <p class="mb-3 text-sm opacity-65">Deleting the app signs everyone out of it.</p>
            <label class="mb-3 flex gap-2 text-sm"><input type="checkbox" required> Yes, delete it</label>
            <button th:replace="~{fragments/button :: submit('Delete app', 'Deleting…')}"></button>
        </form>
    </th:block>
</th:block>
</html>
