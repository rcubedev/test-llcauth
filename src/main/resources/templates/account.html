<!DOCTYPE html>
<!--/* /account: who's signed in, and a sign-out button. Same card as the sign-in page. */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{login :: head('Account')}">
  <title>Account</title>
</head>
<body class="min-h-screen font-body antialiased">
<main class="flex min-h-[100dvh] items-center justify-center px-6">
  <div class="relative w-full max-w-sm">
    <div class="absolute inset-0 translate-x-3 translate-y-3 bg-[var(--ontik-accent)] md:translate-x-4 md:translate-y-4"></div>

    <div class="relative border-2 border-black bg-[var(--background)] p-8">
      <h1 class="mb-2 font-display text-2xl font-bold">You’re signed in</h1>
      <p class="mb-8 text-sm opacity-65">
        <span th:text="${user.name()} ?: ${user.email()}">Sam Lee</span>
        <br>
        <span th:if="${user.name()}" th:text="${user.email()}">sam@example.com</span>
      </p>
      <p class="mb-8 text-sm">Role: <strong th:text="${#strings.capitalize(#strings.toLowerCase(user.role().name()))}">Staff</strong></p>

      <form method="post" action="/logout">
        <button th:replace="~{login :: submitButton('Sign out', 'Signing out…')}"></button>
      </form>

      <svg th:replace="~{login :: sparkleIcon('pointer-events-none absolute -top-12 -right-10 h-14 w-9 rotate-[16deg] text-[var(--ontik-accent)]')}"></svg>
      <svg th:replace="~{login :: sparkleIcon('pointer-events-none absolute -bottom-10 -left-5 h-9 w-6 rotate-[-15deg] text-[#1B2340]')}"></svg>
    </div>
  </div>
</main>
</body>
</html>
