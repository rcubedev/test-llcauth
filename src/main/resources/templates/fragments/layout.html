<!--/* @thymesVar id="assets" type="org.limelightcreatives.auth.web.Assets" */-->
<!--/* @thymesVar id="title" type="java.lang.String" */-->

<!DOCTYPE html>
<html lang="en" class="h-full antialiased" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title th:text="|${title} · Limelight Creatives|">Sign in · Limelight Creatives</title>
        <meta name="robots" content="noindex">

        <meta name="theme-color" content="#fffdf5">
        <link rel="icon" th:href="${assets.url('/favicon.ico')}">

        <link rel="preload" th:href="${assets.url('/fonts/classica/Classica-Bold.woff2')}" as="font" type="font/woff2" crossorigin>
        <link rel="preload" th:href="${assets.url('/fonts/hanken-grotesk/HankenGrotesk-Regular.woff2')}" as="font" type="font/woff2" crossorigin>

        <link rel="stylesheet" th:href="${assets.url('/css/app.css')}">
        <script th:src="${assets.url('/js/login.js')}" defer></script>
    </head>
    <body class="min-h-full">
    <main class="flex min-h-[100dvh] items-center justify-center px-6">
        <div class="relative w-full max-w-sm">
            <div class="absolute inset-0 translate-x-3 translate-y-3 bg-[var(--ontik-accent)] md:translate-x-4 md:translate-y-4"></div>

            <div class="relative border-2 border-black bg-[var(--background)] p-8">
                <th:block th:replace="${content}"></th:block>

                <svg th:replace="~{fragments/art :: sparkle('pointer-events-none absolute -top-12 -right-10 h-14 w-9 rotate-[16deg] text-[var(--ontik-accent)]')}"></svg>
                <svg th:replace="~{fragments/art :: sparkle('pointer-events-none absolute -top-8 right-0 h-6 w-4 rotate-[-6deg] text-[#1B2340]')}"></svg>
                <svg th:replace="~{fragments/art :: sparkle('pointer-events-none absolute -bottom-10 -left-5 h-9 w-6 rotate-[-15deg] text-[#1B2340]')}"></svg>
            </div>
        </div>
    </main>
    </body>
</html>
