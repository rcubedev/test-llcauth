spring:
  application:
    name: limelight-auth
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: 5
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  session:
    timeout: 2h
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 0 * * * *"
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

auth:
  base-url: ${AUTH_BASE_URL:https://auth.limelightcreatives.org}
  root-domain: ${AUTH_ROOT_DOMAIN:limelightcreatives.org}
  cookie-domain: ${AUTH_COOKIE_DOMAIN:.limelightcreatives.org}
  secure-cookies: true
  default-redirect: ${AUTH_DEFAULT_REDIRECT:https://auth.limelightcreatives.org/account}
  session-lifetime: 30d
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:sign-in@auth.limelightcreatives.org}
    log-code-if-unsent: false
