spring:
  application:
    name: limelight-auth
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: 5
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  session:
    timeout: 2h
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 0 * * * *"
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

auth:
  base-url: ${AUTH_BASE_URL:https://auth.limelightcreatives.org}
  root-domain: ${AUTH_ROOT_DOMAIN:limelightcreatives.org}
  cookie-domain: ${AUTH_COOKIE_DOMAIN:.limelightcreatives.org}
  secure-cookies: true
  default-redirect: ${AUTH_DEFAULT_REDIRECT:https://auth.limelightcreatives.org/account}
  session-lifetime: 30d
  oauth:
    jwt-key: ${AUTH_JWT_KEY:}
    generate-jwt-key: false
    access-token-lifetime: 10m
    refresh-token-lifetime: 30d
    clients:
      dashboard:
        name: Limelight Creatives Dashboard
        secret: ${AUTH_DASHBOARD_CLIENT_SECRET:}
        redirect-uris: ${AUTH_DASHBOARD_URL:https://dashboard.limelightcreatives.org}/login/oauth2/code/limelight
        post-logout-redirect-uris: ${AUTH_DASHBOARD_URL:https://dashboard.limelightcreatives.org}/
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:sign-in@auth.limelightcreatives.org}
    log-code-if-unsent: false
    log-codes-without-key: false
