spring:
  application:
    name: limelight-auth
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      minimum-idle: 0
      idle-timeout: 60000
      maximum-pool-size: 5
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${PORT:8080}
  forward-headers-strategy: native

auth:
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:sign-in@auth.limelightcreatives.org}
    log-code-if-unsent: false
