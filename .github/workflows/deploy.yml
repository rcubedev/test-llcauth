name: Deploy

# Deploys to Railway (see README, "Deploying"):
#   staging:    every push to main that passes the Build workflow, automatically.
#   production: by hand: Actions > Deploy > Run workflow > production (deploys the branch you pick).
#
# Each GitHub environment (Settings > Environments: "staging", "production") holds a secret
# RAILWAY_TOKEN: a Railway project token for the matching Railway environment. Optionally a
# variable RAILWAY_SERVICE if the Railway service isn't called "auth". Until an environment has
# its token, its deploys skip with a note instead of failing.

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [production, staging]
        default: production

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE: ${{ vars.RAILWAY_SERVICE || 'auth' }}
    steps:
      # The commit that passed the tests (or, run by hand, the branch picked).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to Railway
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::notice::Not deployed: this environment has no RAILWAY_TOKEN secret yet (see README, Deploying)."
            exit 0
          fi
          # Uploads this commit; Railway builds the Dockerfile and swaps over once /actuator/health is UP.
          railway up --service "$SERVICE" --ci
