name: Deploy

on: workflow_call

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download native image
        uses: actions/download-artifact@v8
        with:
          name: auth-native
          path: build/native/nativeCompile/

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-vercel-65.16.0

      - name: Install Vercel CLI
        run: npm install --global vercel@65.16.0

      - name: Determine Aliases
        id: alias
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
          PREFIX: ${{ vars.VERCEL_HOST_PREFIX }}
          SUFFIX: ${{ vars.VERCEL_HOST_SUFFIX }}
        run: |
          echo "commit=${PREFIX}-${SHA:0:8}-${SUFFIX}" >> "$GITHUB_OUTPUT"

          head=$(git ls-remote origin "refs/heads/$BRANCH_NAME" | cut -f1)
          if [[ "$head" != "$SHA" ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "latest=true" >> "$GITHUB_OUTPUT"

          if [[ "$BRANCH_NAME" == "$DEFAULT_BRANCH" ]]; then
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          slugify() {
            printf '%s' "$1" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//'
          }

          slug=$(slugify "$BRANCH_NAME")
          [[ -n "$slug" ]] || slug="branch"

          clash=false
          while IFS= read -r other; do
            [[ "$other" == "$BRANCH_NAME" ]] && continue
            if [[ "$(slugify "$other")" == "$slug" ]]; then
              clash=true
              break
            fi
          done < <(git ls-remote --heads origin | sed 's|.*refs/heads/||')

          # <prefix>-git-<slug>-<team> must fit in a 63 character DNS label
          max=$(( 63 - ${#PREFIX} - ${#SUFFIX} + 11 - 6 ))
          if [[ "$clash" == true || ${#slug} -gt $max ]]; then
            hash=$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-8)
            slug="${slug:0:$(( max - 9 ))}"
            slug="${slug%-}-${hash}"
          fi

          echo "branch=${PREFIX}-git-${slug}-${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Prepare Version Message
        id: message
        run: |
          message=$(git log -1 --format=%s | tr -d '"`$\\' | cut -c1-100)
          echo "message=${message}" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        if: steps.alias.outputs.latest == 'true' && steps.alias.outputs.branch == ''
        env:
          SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          MESSAGE: ${{ steps.message.outputs.message }}
          COMMIT_ALIAS: ${{ steps.alias.outputs.commit }}
        run: |
          alias_to() {
            local id
            id=$(curl -fsS "https://api.vercel.com/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r .id)
            curl -fsS -X POST "https://api.vercel.com/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "{\"alias\":\"$1\"}" > /dev/null
          }

          url=$(vercel deploy --prod --token "$VERCEL_TOKEN" \
            --meta githubCommitSha="$SHA" --meta githubCommitRef="$BRANCH_NAME" --meta githubCommitMessage="$MESSAGE")
          alias_to "$COMMIT_ALIAS"
          printf 'Deployment: %s\nThis commit: https://%s\n' "$url" "$COMMIT_ALIAS" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy branch preview
        if: steps.alias.outputs.latest == 'false' || steps.alias.outputs.branch != ''
        env:
          SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          MESSAGE: ${{ steps.message.outputs.message }}
          COMMIT_ALIAS: ${{ steps.alias.outputs.commit }}
          BRANCH_ALIAS: ${{ steps.alias.outputs.branch }}
        run: |
          alias_to() {
            local id
            id=$(curl -fsS "https://api.vercel.com/v13/deployments/${url#https://}?teamId=$VERCEL_ORG_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r .id)
            curl -fsS -X POST "https://api.vercel.com/v2/deployments/$id/aliases?teamId=$VERCEL_ORG_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "{\"alias\":\"$1\"}" > /dev/null
          }

          url=$(vercel deploy --token "$VERCEL_TOKEN" \
            --meta githubCommitSha="$SHA" --meta githubCommitRef="$BRANCH_NAME" --meta githubCommitMessage="$MESSAGE")
          alias_to "$COMMIT_ALIAS"
          printf 'Deployment: %s\nThis commit: https://%s\n' "$url" "$COMMIT_ALIAS" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$BRANCH_ALIAS" ]]; then
            alias_to "$BRANCH_ALIAS"
            printf 'Branch: https://%s\n' "$BRANCH_ALIAS" >> "$GITHUB_STEP_SUMMARY"
          fi
