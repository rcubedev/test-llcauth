name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    # Every OS people build this on. In a private repo, Windows minutes count double and macOS ten
    # times against the free 2,000 a month; if that runs short, drop them from the list below.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Tests start their own PostgreSQL; nothing else to set up.
      - run: ./gradlew build :build-logic:test

  docker:
    name: Docker image builds
    # What a host (Railway, or any other) builds when deploying, so a broken Dockerfile shows up here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
