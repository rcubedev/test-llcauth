name: Build

on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    name: Build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache build-logic outputs
        uses: actions/cache@v6
        with:
          path: build-logic/build
          key: build-logic-${{ runner.os }}-${{ hashFiles('build-logic/src/**', 'build-logic/**/*.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: auth-jar
          path: |
            build/libs/*.jar
            !build/libs/*-plain.jar
          if-no-files-found: 'error'

  native:
    name: Native Image
    if: >-
      github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache build-logic outputs
        uses: actions/cache@v6
        with:
          path: build-logic/build
          key: build-logic-${{ runner.os }}-${{ hashFiles('build-logic/src/**', 'build-logic/**/*.kts', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build native image
        env:
          LEVEL: ${{ github.ref_name == github.event.repository.default_branch && '2' || 'b' }}
        run: ./gradlew nativeCompile -Pnative.optimization=$LEVEL

      - name: Compress native image
        run: pigz -9 build/native/nativeCompile/auth

      - name: Capture native image
        uses: actions/upload-artifact@v7
        with:
          name: auth-native
          path: build/native/nativeCompile/auth.gz
          compression-level: 0
          if-no-files-found: 'error'

  docker:
    name: Docker Image Build
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download native image
        uses: actions/download-artifact@v8
        with:
          name: auth-native
          path: build/native/nativeCompile/

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: [build, native]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
